[package]
name = "husk-cli"
version = "0.1.0"
edition = "2021"
authors = ["Husk Team"]
description = "Graph-Native Code CLI & Multi-Agent Orchestration System"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
petgraph = { version = "0.6", features = ["serde-1"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
colored = "2.1"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
walkdir = "2.5"
regex = "1.10"
ratatui = "0.28"
crossterm = "0.28"

[dev-dependencies]
tokio-test = "0.4"
